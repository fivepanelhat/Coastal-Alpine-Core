[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-alpine-core"
version = "0.2.0"
authors = [
  { name="Wayne Roberts", email="architecture@coastalalpinetech.local" },
]
description = "Sovereign Stack Shared Core Models and Auth Logic"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "ollama"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
