name: Publish Sovereign Core Packages
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - 'v*.*.*' # Only triggers when you push a version tag, e.g., v1.0.2

# Least-privilege default (Diamond standard); jobs elevate only what they need.
permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish Node Package for Portals
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@fivepanelhat'
      # No package-lock.json is committed, so `npm ci` can never run here
      - run: npm install
      - run: npm run build --if-present
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-python:
    name: Publish Python Wheel for Edge Nodes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build Wheel
        run: python -m build
      - name: Attach wheel to the GitHub Release
        # GitHub Packages has no PyPI registry (the old step twine-uploaded a
        # wheel to the NuGet endpoint and got 405). Edge nodes install from
        # the release asset or via git+https, so publish the artefacts there.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Release $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
