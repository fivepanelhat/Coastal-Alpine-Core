name: "Verify Portal Against Core"
description: "Install specific core version and run full test suite"

inputs:
  core-ref:
    description: "Git ref or tag (e.g. v0.3.0)"
    required: true
    default: "main"

runs:
  using: "composite"
  steps:
    - name: Checkout core
      uses: actions/checkout@v6
      with:
        repository: fivepanelhat/coastal-alpine-core
        ref: ${{ inputs.core-ref }}
        path: core-checkout

    - name: Install core
      shell: bash
      run: pip install -e ./core-checkout

    - name: Run tests
      shell: bash
      run: pytest -q --tb=short
